name: Refresh Detroit Data

on:
  schedule:
    - cron: '0 10 * * *'  # 6 AM ET daily
  workflow_dispatch:        # manual trigger

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install supabase httpx

      - name: Fetch fresh data from Detroit APIs
        run: python scripts/refresh-data.py
        timeout-minutes: 20

      - name: Refresh materialized views
        run: python scripts/refresh-views.py
        timeout-minutes: 5

      - name: Verify data counts
        run: python scripts/verify-data.py

  smoke-test:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run smoke tests
        run: npx playwright test --grep @smoke
        env:
          BASE_URL: https://detroit-data-intel.vercel.app
