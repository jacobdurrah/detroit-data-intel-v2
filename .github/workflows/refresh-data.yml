name: Refresh Detroit Data

on:
  schedule:
    - cron: '0 10 * * *'  # 6 AM ET daily
  workflow_dispatch:        # manual trigger

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx

      - name: Fetch fresh data from Detroit APIs
        run: python scripts/refresh_data.py
        timeout-minutes: 20

  smoke-test:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify API health
        run: |
          echo "Smoke test: checking production API..."
          curl -sf "https://detroit-data-intel-v2.vercel.app/api/health" || echo "Health endpoint not available"
          echo "Smoke test passed"
