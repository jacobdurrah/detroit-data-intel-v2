<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f1a">
  <title>Detroit Data Intelligence Platform</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="">
  <link rel="stylesheet" href="/css/style.css?v=20260320c">
</head>
<body>
  <div id="app" style="display:none;">
    <header id="stats-bar">
      <div class="stats-scroll">
        <div class="stat-item" id="stat-sales">
          <span class="stat-label">Sales</span>
          <span class="stat-value skeleton">--</span>
        </div>
        <div class="stat-item" id="stat-investors">
          <span class="stat-label">Investors</span>
          <span class="stat-value skeleton">--</span>
        </div>
        <div class="stat-item" id="stat-permits">
          <span class="stat-label">Permits</span>
          <span class="stat-value skeleton">--</span>
        </div>
        <div class="stat-item" id="stat-blight">
          <span class="stat-label">Blight</span>
          <span class="stat-value skeleton">--</span>
        </div>
        <div class="stat-item" id="stat-neighborhoods">
          <span class="stat-label">Neighborhoods</span>
          <span class="stat-value skeleton">--</span>
        </div>
        <div class="stat-item" id="stat-pipeline">
          <span class="stat-label">Pipeline</span>
          <span class="stat-value skeleton">--</span>
        </div>
      </div>
    </header>

    <main id="content">
      <!-- Map Tab -->
      <div id="tab-map" class="tab-content active">
        <div class="map-search" id="map-search">
          <input type="text" id="map-search-input" placeholder="Search address..." class="search-input" autocomplete="off">
          <button id="map-search-btn" aria-label="Search address">&#128269;</button>
        </div>
        <div id="map"></div>
        <div id="map-layers" class="layer-panel">
          <button id="layer-toggle-btn" class="layer-toggle-btn" aria-label="Toggle layers">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
          </button>
          <div class="layer-list" id="layer-list">
            <label class="layer-check"><input type="checkbox" data-layer="sales" checked><span class="layer-dot" style="background:#3b82f6"></span>Sales</label>
            <label class="layer-check"><input type="checkbox" data-layer="permits"><span class="layer-dot" style="background:#10b981"></span>Permits</label>
            <label class="layer-check"><input type="checkbox" data-layer="trades"><span class="layer-dot" style="background:#8b5cf6"></span>Trades</label>
            <label class="layer-check"><input type="checkbox" data-layer="blight"><span class="layer-dot" style="background:#ef4444"></span>Blight</label>
            <label class="layer-check"><input type="checkbox" data-layer="dlba"><span class="layer-dot" style="background:#f59e0b"></span>DLBA</label>
            <label class="layer-check"><input type="checkbox" data-layer="demos"><span class="layer-dot" style="background:#6b7280"></span>Demos</label>
            <label class="layer-check"><input type="checkbox" data-layer="rentals"><span class="layer-dot" style="background:#06b6d4"></span>Rentals</label>
            <label class="layer-check"><input type="checkbox" data-layer="crime"><span class="layer-dot" style="background:#dc2626"></span>Crime</label>
            <label class="layer-check"><input type="checkbox" data-layer="vacant"><span class="layer-dot" style="background:#d97706"></span>Vacant</label>
            <label class="layer-check"><input type="checkbox" data-layer="newbuilds"><span class="layer-dot" style="background:#22d3ee"></span>New Builds</label>
            <label class="layer-check"><input type="checkbox" data-layer="leadreplace"><span class="layer-dot" style="background:#a855f7"></span>Lead Line Replace</label>
            <label class="layer-check"><input type="checkbox" data-layer="density"><span class="layer-dot" style="background:#f472b6"></span>Pop Density</label>
            <label class="layer-check"><input type="checkbox" data-layer="foreclosures"><span class="layer-dot" style="background:#f43f5e"></span>Foreclosures</label>
            <div class="view-toggle" style="margin-top:8px;">
              <button class="toggle-btn active" id="map-mode-cluster">Clusters</button>
              <button class="toggle-btn" id="map-mode-heat">Heatmap</button>
            </div>
            <div class="time-filter">
              <label>Time Range</label>
              <select id="map-time-range">
                <option value="all">All Time</option>
                <option value="6m">Last 6 Months</option>
                <option value="1y" selected>Last Year</option>
                <option value="2y">Last 2 Years</option>
                <option value="5y">Last 5 Years</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Search Tab -->
      <div id="tab-search" class="tab-content">
        <div class="tab-panel">
          <div class="filter-bar search-filter-bar">
            <input type="date" id="search-date" class="filter-input">
            <div class="search-stats" id="search-stats"></div>
          </div>
          <div id="search-list" class="card-grid">
            <div class="loading-state">
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
            </div>
          </div>
          <div id="search-pagination" class="pagination"></div>
        </div>
      </div>

      <!-- Saved Tab -->
      <div id="tab-saved" class="tab-content">
        <div class="tab-panel">
          <div class="filter-bar" style="flex-wrap:wrap;gap:8px;">
            <div class="status-pills" id="saved-status-pills" style="flex:1;">
              <button class="pill-btn active" data-status="">All</button>
              <button class="pill-btn" data-status="researching">Researching</button>
              <button class="pill-btn" data-status="offer_pending">Offer Pending</button>
              <button class="pill-btn" data-status="under_contract">Under Contract</button>
              <button class="pill-btn" data-status="closed">Closed</button>
              <button class="pill-btn" data-status="passed">Passed</button>
            </div>
            <button id="btn-add-property" class="pill-btn" style="background:var(--accent);color:white;font-weight:bold;">+ Add Property</button>
          </div>
          <div id="add-property-form" style="display:none;padding:12px;background:var(--surface);border-radius:8px;margin:0 12px 12px;">
            <input type="text" id="add-property-address" placeholder="Enter full address (e.g. 1234 Main St, Detroit, MI 48224)" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;box-sizing:border-box;margin-bottom:8px;">
            <div style="display:flex;gap:8px;">
              <input type="number" id="add-property-price" placeholder="List price ($)" style="flex:1;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;">
              <input type="text" id="add-property-neighborhood" placeholder="Neighborhood" style="flex:1;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;">
            </div>
            <div style="display:flex;gap:8px;margin-top:8px;">
              <button id="btn-save-new-property" class="pill-btn" style="background:#10b981;color:white;flex:1;padding:10px;font-weight:bold;">Save &amp; Request DD Report</button>
              <button id="btn-cancel-add" class="pill-btn" style="background:var(--border);color:var(--text);padding:10px;">Cancel</button>
            </div>
          </div>
          <div id="saved-list" class="card-grid">
            <div class="loading-state">
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
            </div>
          </div>
          <div id="saved-pagination" class="pagination"></div>
        </div>
      </div>

      <!-- Reports Tab -->
      <div id="tab-reports" class="tab-content">
        <div class="tab-panel">
          <div class="filter-bar">
            <div class="status-pills" id="reports-verdict-pills">
              <button class="pill-btn active" data-verdict="">All</button>
              <button class="pill-btn pill-buy" data-verdict="BUY">BUY</button>
              <button class="pill-btn pill-watch" data-verdict="WATCH">WATCH</button>
              <button class="pill-btn pill-pass" data-verdict="PASS">PASS</button>
            </div>
          </div>
          <div id="reports-list" class="card-grid">
            <div class="loading-state">
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
            </div>
          </div>
          <div id="reports-pagination" class="pagination"></div>
        </div>
      </div>

      <!-- Investors Tab -->
      <div id="tab-investors" class="tab-content">
        <div class="tab-panel">
          <div class="filter-bar investor-filter-bar">
            <input type="text" id="investor-search" class="search-input" placeholder="Search investors...">
            <div class="filter-group">
              <label class="filter-label">From</label>
              <input type="date" id="investor-date-from" class="filter-input">
            </div>
            <div class="filter-group">
              <label class="filter-label">To</label>
              <input type="date" id="investor-date-to" class="filter-input">
            </div>
            <div class="filter-group">
              <label class="filter-label">Min Purchases</label>
              <input type="number" id="investor-min-purchases" class="filter-input" value="2" min="1" style="width:70px;">
            </div>
            <div class="filter-group">
              <label class="filter-label">Max Purchases</label>
              <input type="number" id="investor-max-purchases" class="filter-input" placeholder="--" min="1" style="width:70px;">
            </div>
            <select id="investor-sort" class="filter-select">
              <option value="total_purchases">Most Purchases</option>
              <option value="total_spend">Highest Spend</option>
              <option value="avg_price">Avg Price</option>
              <option value="last_purchase">Most Recent</option>
              <option value="neighborhoods_active">Most Neighborhoods</option>
              <option value="name">Name A-Z</option>
            </select>
          </div>
          <div id="investors-list" class="card-list">
            <div class="loading-state">
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
            </div>
          </div>
          <div id="investors-pagination" class="pagination"></div>
        </div>
      </div>

      <!-- Neighborhoods Tab -->
      <div id="tab-neighborhoods" class="tab-content">
        <div class="tab-panel">
          <div class="filter-bar">
            <select id="neighborhood-sort" class="filter-select">
              <option value="score">Score</option>
              <option value="sales">Sales Volume</option>
              <option value="price">Median Price</option>
              <option value="permits">Permits</option>
              <option value="blight">Blight (Low First)</option>
            </select>
            <select id="neighborhood-time-range" class="filter-select">
              <option value="all">All Time</option>
              <option value="1y" selected>Last Year</option>
              <option value="2y">Last 2 Years</option>
            </select>
            <label class="filter-check-label"><input type="checkbox" id="neighborhood-show-empty"> Show Empty</label>
            <button class="score-weights-toggle" id="score-weights-toggle-btn">Score Weights &#9660;</button>
          </div>
          <div class="score-weights-panel" id="score-weights-panel">
            <div class="weight-row"><label>Sales Volume</label><input type="range" min="0" max="100" value="25" data-weight="sales_volume"><span class="weight-val">25</span></div>
            <div class="weight-row"><label>Median Price</label><input type="range" min="0" max="100" value="25" data-weight="median_price"><span class="weight-val">25</span></div>
            <div class="weight-row"><label>Permit Activity</label><input type="range" min="0" max="100" value="20" data-weight="permit_activity"><span class="weight-val">20</span></div>
            <div class="weight-row"><label>Blight (inverse)</label><input type="range" min="0" max="100" value="15" data-weight="blight"><span class="weight-val">15</span></div>
            <div class="weight-row"><label>Rentals</label><input type="range" min="0" max="100" value="10" data-weight="rentals"><span class="weight-val">10</span></div>
            <div class="weight-row"><label>Demos (inverse)</label><input type="range" min="0" max="100" value="5" data-weight="demos"><span class="weight-val">5</span></div>
          </div>
          <div id="neighborhoods-list" class="card-list">
            <div class="loading-state">
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Contractors Tab -->
      <div id="tab-contractors" class="tab-content">
        <div class="tab-panel">
          <div class="filter-bar">
            <input type="text" id="contractor-search" class="search-input" placeholder="Search contractors...">
            <select id="contractor-specialty" class="filter-select">
              <option value="">All Specialties</option>
            </select>
            <select id="contractor-sort" class="filter-select">
              <option value="total_permits">Most Permits</option>
              <option value="name">Name A-Z</option>
            </select>
          </div>
          <div id="contractors-list" class="card-list">
            <div class="loading-state">
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
            </div>
          </div>
          <div id="contractors-pagination" class="pagination"></div>
        </div>
      </div>

      <!-- Lending Tab -->
      <div id="tab-lending" class="tab-content">
        <div class="tab-panel">
          <!-- View toggle: Lenders vs All Loans -->
          <div class="view-toggle">
            <button class="toggle-btn active" id="lending-view-lenders" onclick="LendingModule.switchView('lenders')">🏦 Lenders</button>
            <button class="toggle-btn" id="lending-view-loans" onclick="LendingModule.switchView('loans')">📋 All Loans</button>
          </div>

          <!-- Lenders view filters -->
          <div id="lending-lender-filters" class="filter-bar">
            <div class="filter-checks">
              <label class="filter-check-label"><input type="checkbox" id="lending-sub60k"> Sub-$60K</label>
              <label class="filter-check-label"><input type="checkbox" id="lending-investment"> Investment</label>
              <label class="filter-check-label"><input type="checkbox" id="lending-multifamily"> Multifamily</label>
              <label class="filter-check-label"><input type="checkbox" id="lending-llc-sub60k"> LLC Sub-$60K</label>
            </div>
            <select id="lending-sort" class="filter-select">
              <option value="total_loans">Most Loans</option>
              <option value="total_volume">Highest Volume</option>
              <option value="avg_rate">Lowest Rate</option>
              <option value="name">Name A-Z</option>
            </select>
          </div>

          <!-- All Loans view filters -->
          <div id="lending-loan-filters" class="filter-bar" style="display:none;">
            <input type="text" id="loan-search" class="filter-input" placeholder="Search address, buyer, lender, neighborhood...">
            <div class="filter-checks">
              <label class="filter-check-label"><input type="checkbox" id="loan-filter-llc"> 🏢 LLC Only</label>
              <label class="filter-check-label"><input type="checkbox" id="loan-filter-sub60k"> Sub-$60K</label>
              <label class="filter-check-label"><input type="checkbox" id="loan-filter-investment"> Investment</label>
            </div>
            <select id="loan-year-filter" class="filter-select" style="max-width:100px;">
              <option value="">All Years</option>
              <option value="2023">2023</option>
              <option value="2022">2022</option>
              <option value="2021">2021</option>
              <option value="2020">2020</option>
              <option value="2019">2019</option>
              <option value="2018">2018</option>
            </select>
            <select id="loan-sort" class="filter-select">
              <option value="year_desc">Newest Year</option>
              <option value="year_asc">Oldest Year</option>
              <option value="amount_desc">Highest Amount</option>
              <option value="amount_asc">Lowest Amount</option>
              <option value="rate_asc">Lowest Rate</option>
              <option value="rate_desc">Highest Rate</option>
            </select>
          </div>

          <!-- Stats bar for all loans view -->
          <div id="lending-loan-stats" class="stats-bar" style="display:none;"></div>

          <div id="lending-list" class="card-list">
            <div class="loading-state">
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
            </div>
          </div>
          <div id="lending-pagination" class="pagination"></div>
        </div>
      </div>

      <!-- Pipeline Tab -->
      <div id="tab-pipeline" class="tab-content">
        <div class="tab-panel">
          <div class="filter-bar">
            <div class="slider-group">
              <label for="pipeline-score">Min Score: <span id="pipeline-score-val">50</span></label>
              <input type="range" id="pipeline-score" min="0" max="100" value="50" class="range-input">
            </div>
            <select id="pipeline-neighborhood" class="filter-select">
              <option value="">All Neighborhoods</option>
            </select>
          </div>
          <div id="pipeline-list" class="card-list">
            <div class="loading-state">
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
            </div>
          </div>
          <div id="pipeline-pagination" class="pagination"></div>
        </div>
      </div>

      <!-- Sources Tab -->
      <div id="tab-sources" class="tab-content">
        <div class="tab-panel">
          <div id="sources-content" class="sources-page">
            <div class="loading-state"><div class="skeleton-card"></div></div>
          </div>
        </div>
      </div>
    </main>

    <nav id="tab-bar">
      <button class="tab-btn active" data-tab="map" aria-label="Map">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
          <line x1="8" y1="2" x2="8" y2="18"></line>
          <line x1="16" y1="6" x2="16" y2="22"></line>
        </svg>
        <span>Map</span>
      </button>
      <button class="tab-btn" data-tab="search" aria-label="Search">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Search</span>
      </button>
      <button class="tab-btn" data-tab="saved" aria-label="Saved">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Saved</span>
      </button>
      <button class="tab-btn" data-tab="reports" aria-label="Reports">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span>Reports</span>
      </button>
      <button class="tab-btn" data-tab="investors" aria-label="Investors">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Investors</span>
      </button>
      <button class="tab-btn" data-tab="neighborhoods" aria-label="Neighborhoods">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Areas</span>
      </button>
      <button class="tab-btn" data-tab="contractors" aria-label="Contractors">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
          </svg>
        <span>Contractors</span>
      </button>
      <button class="tab-btn" data-tab="lending" aria-label="Lending">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        <span>Lending</span>
      </button>
      <button class="tab-btn" data-tab="pipeline" aria-label="Pipeline">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
        <span>Pipeline</span>
      </button>
      <button class="tab-btn" data-tab="sources" aria-label="Sources">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span>Sources</span>
      </button>
    </nav>

    <button id="chat-fab" aria-label="Open chat">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </button>

    <div id="chat-panel" class="hidden">
      <div id="chat-header">
        <span>Detroit Intel Chat</span>
        <button id="chat-close" aria-label="Close chat">
